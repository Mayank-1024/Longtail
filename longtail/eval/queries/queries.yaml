# LongTail evaluation queries (M7), Mayank. 25 queries: 10 dev, 15 held-out.
# Split: seeded random draw within each tier (seed 20261102; dev = 3 single, 4 behaviour, 3 relational), not chosen by hand.
# Frozen by commit before the Nov 3 feature freeze; a query may be replaced only before the freeze (plan C7).
# Format A-128 (longtail.queries/v1); gold specs are ScenarioSpecs evaluated on labels by `longtail gt build`.
format: longtail.queries/v1
queries:
- query_id: cyclist_within_15
  text: a cyclist within 15 m
  split: heldout
  tier: single
  gold:
    query: a cyclist within 15 m
    actors:
    - id: a1
      cls: cyclist
      sam_prompt: cyclist
    predicates:
    - name: exists
      actors:
      - a1
      args: {}
    - name: within_distance
      actors:
      - a1
      args:
        m: 15.0
    assumptions: []
    clarification: null
- query_id: bus_ahead_30
  text: a bus ahead of us within 30 m
