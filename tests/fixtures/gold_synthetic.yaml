# Gold specs for the synthetic scene (C7 and C8 tests). Same format as M7's queries file (A-128).
format: longtail.queries/v1
queries:
  - query_id: syn_crossing
    text: a pedestrian crossing in front of us while we move
    split: dev
    tier: behaviour
    gold:
      query: a pedestrian crossing in front of us while we move
      actors: [{id: a1, cls: pedestrian, sam_prompt: person}]
      predicates:
        - {name: exists, actors: [a1], args: {}}
        - {name: crossing_ego_path, actors: [a1], args: {}}
        - {name: ego_moving, actors: [], args: {}}
      assumptions: []
      clarification: null
  - query_id: syn_parked
    text: a parked car
    split: dev
    tier: single
    gold:
      query: a parked car
      actors: [{id: c1, cls: car, sam_prompt: car}]
      predicates:
        - {name: exists, actors: [c1], args: {}}
        - {name: stopped, actors: [c1], args: {}}
      assumptions: []
      clarification: null
  - query_id: syn_occluded
    text: a pedestrian partly hidden by a car
    split: heldout
    tier: relational
    gold:
      query: a pedestrian partly hidden by a car
      actors: [{id: a1, cls: pedestrian, sam_prompt: person}]
      predicates:
        - {name: exists, actors: [a1], args: {}}
        - {name: occluded_by, actors: [a1], args: {cls: car}}
      assumptions: []
      clarification: null
  - query_id: syn_cyclist
    text: a cyclist within 10 m
    split: heldout
    tier: single
    gold:
      query: a cyclist within 10 m
      actors: [{id: a1, cls: cyclist, sam_prompt: cyclist}]
      predicates:
        - {name: exists, actors: [a1], args: {}}
        - {name: within_distance, actors: [a1], args: {m: 10.0}}
      assumptions: []
      clarification: null
